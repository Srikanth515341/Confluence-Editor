name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Engine purity (independent grep check)
        run: pnpm check:purity

      - name: Test
        run: pnpm test

      # Not a separate job (unlike convergence/properties below): the 22
      # adversarial cases (Test Plan §2.4) are fast and deterministic, so
      # they already ran as part of `pnpm test` above. This step exists
      # only to give them their own named, explicit CI signal, per the
      # Phase 5 Definition of Done, without paying for a second runner.
      - name: Adversarial suite (ADV-01..22)
        run: pnpm test:adversarial

  # Separate job (not a step in `ci` above) so GitHub reports it as its own
  # named check — that's what a branch-protection "required status check"
  # picker selects from. This suite is EXPECTED to fail until Phase 3
  # implements integrate() (Engine Spec §4.3); see
  # packages/testkit/src/fuzz/convergence.test.ts. Marking this check as
  # actually REQUIRED in GitHub's branch-protection settings is a manual,
  # one-time repo-settings action — not something a file in this repo can
  # do — and makes most sense to flip on once Phase 3 lands (Test Plan
  # §2.2/§2.3/§12.6, PRD M1(a)/C-7).
  convergence:
    name: Convergence suite (C1-C6, 10^4 seeds/config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Convergence suite
        run: pnpm test:convergence

  # Separate job for the same reason as `convergence` above: its own named
  # check, and its own runtime budget (5 properties at 10^4 generated
  # cases each, Test Plan §2.5) that the fast inner-loop `ci` job above
  # should not have to pay on every push.
  properties:
    name: Property-based suite (PROP-1..5, 10^4 cases/property)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Property-based suite
        run: pnpm test:properties
